APIVersion: v1.5.2
name: iam
type: php
# Install path matches what scripts/install/haxiam-install.sh deploys at:
# /var/www/iam (the installer's --ha default). Empty docroot (->webroot) so
# HAXiam's per-user /{user}/sites/{site}/ pretty-URL rewrite works.
docroot: ""
# Match the Ubuntu-24.04 branch of haxiam-install.sh (PHP 8.3-fpm +
# extensions + Apache 2.4 + mpm_event + http2). Bumps the previously frozen
# 7.3 line so a fresh `ddev start` exercises the same PHP the installer
# ships today.
php_version: "8.3"
# Switch from the historic nginx-fpm to apache-fpm: haxiam-install.sh
# explicitly enables apache2 + mpm_event + a2enmod proxy_fcgi, so the
# install-test sidecar in this .ddev mirrors what an operator would see
# on a real install.
webserver_type: apache-fpm
router_http_port: "80"
router_https_port: "443"
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
# HAXiam + HAXcms-php is PHP-only, no external DB. Drop MariaDB from the
# dev sandbox so it doesn't masquerade as a runtime DB on a real install
# (the installer never installs MariaDB and HAXcms-php writes JSON files
# to _config/SALT.txt).
mariadb_version: ""
# HAXstatic caching is intentionally off — every request should hit
# Apache/PHP so installation-failing routes surface immediately.
webcache_enabled: false
provider: default
# We do not list webimage / dbimage / dbaimage here on purpose: ddev
# recommends deriving them from its current release (matching
# `ddev --version`), and pinning defeats future upgrades.
#
# HOW TO USE THIS .ddev
#
#   1. Once per host:    ddev config --project-type=php --php-version=8.3
#                        --webserver-type=apache-fpm  (already encoded above)
#   2. ddev start
#                        — first start runs the post-start hook which is
#                          the install path. This builds a fully working
#                          HAXiam inside the .ddev sandbox and reaches it
#                          on http://haxiam.ddev.local after a couple of
#                          minutes (mostly apt + git clone + composer).
#   3. ddev restart       — idempotent re-run; installer detects the
#                          existing /var/www/iam/_iamConfig/config.cfg and
#                          does NOT clobber anything (installer invariant
#                          #2 from _contracts/installer_flag_surface.md).
#
# This file replaces the previous .ddev/config.yaml which targeted PHP 7.3
# + nginx-fpm + an obsolete whateveryousayiam.sh post-start. That setup had
# not been run on the host in the project's history and was drift from the
# current installer. See issue #3070.

hooks:
  # The installer's "fresh install" check is: there is NO line beginning
  # with `haxiam=` in _iamConfig/config.cfg. The hook below creates a
  # fully working install on first ddev start, and silently skips on
  # subsequent runs.
  post-start:
  - exec: |
      if ! grep -Eq '^[[:space:]]*haxiam[[:space:]]*=' /var/www/iam/_iamConfig/config.cfg 2>/dev/null; then
        echo "[.ddev] First start — running scripts/install/haxiam-install.sh"
        sudo bash /var/www/iam/scripts/install/haxiam-install.sh --distro auto --skip-le --non-interactive
      else
        echo "[.ddev] Existing install detected at /var/www/iam — skipping installer."
      fi
  # Convenience message telling the operator where to go next.
  - exec: echo 'go to http://haxiam.ddev.local — the install is idempotent, run `ddev restart` after pulling a new installer.'
